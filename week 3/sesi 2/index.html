<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pendaftaran Kegiatan</title>
</head>
<body>
    <main>
        <h1>Pendaftaran Kegiatan</h1>
        <p>Kolom bertanda wajib harus diisi.</p>

        <form action="#" method="get">

            <label for="nama">Nama lengkap (wajib)</label>
            <input id="nama" name="nama" autocomplete="name" required>

            <label for="email">Email (wajib)</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="telepon">Nomor Telepon</label>
            <input id="telepon" name="telepon" type="tel" autocomplete="tel">

            <label for="tiket">Jumlah Tiket</label>
            <input id="tiket" name="tiket" type="number" min="1" max="5" step="1">

            <label for="prodi">Program studi (wajib)</label><br>
            <select id="prodi" name="prodi" required><br>
                <option value="">Pilih program studi</option><br>
                <option value="trpl">D4 TRPL</option>
                <option value="ti">D3 Teknologi Informasi</option>
            </select>

            <fieldset>
                <legend>Mode kehadiran (wajib)</legend>
                <input id="luring" name="mode" type="radio" value="luring" required>
                <label for="luring">Luring</label>

                <input id="daring" name="mode" type="radio" value="daring">
                <label for="daring">Daring</label>
            </fieldset>

            <fieldset>
                <legend>Minat Topik</legend>
                <input id="topik_html" name="topik" type="checkbox" value="html">
                <label for="topik_html">HTML</label>

                <input id="topik_aksesibilitas" name="topik" type="checkbox" value="aksesibilitas">
                <label for="topik_aksesibilitas">Aksesibilitas</label>
            </fieldset>

            <label for="catatan">Catatan (opsional)</label>
            <textarea id="catatan" name="catatan" rows="4" maxlength="300"></textarea>

            <button type="submit">Daftar</button>

        </form>
    </main>
</body>
</html>
